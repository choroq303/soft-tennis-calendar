<script>
      const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxricXsnjpfBfNgmbmLLESqnLVn-bvEm3xbuAVls2Y7SDh3S-h9Eaxuc8L8Ygqn8WmcBg/exec';
      const LIFF_ID = 'あなたのLIFF_ID'; // ご自身のLIFF IDに書き換えてください

      let userProfile = null; // LINEのユーザー情報を保持する変数

      document.addEventListener('DOMContentLoaded', function() {
        // 1. LIFFの初期化とユーザー情報の取得
        liff.init({ liffId: LIFF_ID }).then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              userProfile = profile; // ログイン中のユーザー情報を取得成功！
            }).catch(err => console.error('Profile fetch failed', err));
          }
        }).catch(err => {
          console.log('LIFF Initialization failed.', err);
        });

        const calendarEl = document.getElementById('calendar');
        
        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          headerToolbar: {
            left: 'prev',
            center: 'title',
            right: 'next'
          },
          height: '100%',
          events: function(fetchInfo, successCallback, failureCallback) {
            // GASのAPIからイベントデータを取得
            fetch(GAS_API_URL)
              .then(response => response.json())
              .then(data => {
                successCallback(data);
              })
              .catch(error => {
                console.error('Error fetching events:', error);
                failureCallback(error);
              });
          },
          eventClick: function(info) {
            showDetail(info.event.startStr, info.event.title);
          },
          dateClick: function(info) {
            const clickedEvent = calendar.getEvents().find(ev => ev.startStr === info.dateStr);
            if (clickedEvent) {
              showDetail(info.dateStr, clickedEvent.title);
            } else {
              // 予定がない日をタップした場合のデフォルト（必要に応じて変更可能）
              // showDetail(info.dateStr, '練習');
            }
          },
          datesSet: function() {
            removeDayText();
          }
        });
        
        calendar.render();
      });

      // マス目内の日付から「日」を消去する関数
      function removeDayText() {
        setTimeout(() => {
          const dayNumbers = document.querySelectorAll('.fc-daygrid-day-number');
          dayNumbers.forEach(elem => {
            if (elem.textContent.includes('日')) {
              elem.textContent = elem.textContent.replace('日', '');
            }
          });
        }, 10);
      }

      // 詳細カード用の日付フォーマット（「日」なし）
      function formatDateWithoutDay(dateStr) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return Number(parts[0]) + '年 ' + Number(parts[1]) + '月 ' + Number(parts[2]);
        }
        return dateStr;
      }

      function showDetail(dateStr, title) {
        const formattedDate = formatDateWithoutDay(dateStr);
        const detailArea = document.getElementById('event-detail-area');
        detailArea.innerHTML = `
          <div class="card bg-base-100 shadow-md p-4 border-l-8 border-success flex flex-row justify-between items-center rounded-none sm:rounded-box">
            <div>
              <div class="font-bold text-base text-slate-800">${formattedDate}</div>
              <div class="text-sm text-slate-600 mt-1">🎾 ${title}</div>
            </div>
            <button onclick="openAttendanceModal('${dateStr}', '${title}')" class="btn btn-success btn-sm text-white font-bold">出欠席</button>
          </div>
        `;
      }

      // 2. 「出欠席」ボタンを押したときの処理（確認ダイアログ ＋ GASへPOST送信）
      function openAttendanceModal(dateStr, title) {
        if (!userProfile) {
          alert('LINEのユーザー情報を取得中です。少し待ってからもう一度お試しください。');
          return;
        }

        // OK = 出席、キャンセル = 欠席
        const isAttending = confirm(`${userProfile.displayName} さん\n${formatDateWithoutDay(dateStr)} (${title})\n\n「OK」で出席、「キャンセル」で欠席として登録します`);
        
        const attendanceData = {
          date: dateStr,
          userId: userProfile.userId,
          displayName: userProfile.displayName,
          status: isAttending ? '出席' : '欠席'
        };

        submitAttendance(attendanceData);
      }

      // 3. GASのAPIへデータをPOSTする関数
      function submitAttendance(data) {
        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert('出欠席を登録しました！');
          } else {
            alert('登録に失敗しました: ' + (result.message || '不明なエラー'));
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('通信エラーが発生しました。');
        });
      }
    </script>
