<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullCalendar 単体テスト</title>
    <!-- Tailwind CSS & DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- FullCalendar CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
    <!-- FullCalendar JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
      /* FullCalendarのデザインをDaisyUI/Tailwindの雰囲気に馴染ませる調整 */
      #calendar {
        background: white;
        padding: 12px;
        border-radius: 1rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .fc .fc-toolbar-title {
        font-size: 1.1rem !important;
        font-weight: bold;
      }
      .fc .fc-button {
        background-color: #22c55e !important; /* Tailwind successカラー */
        border-color: #22c55e !important;
        font-size: 0.85rem !important;
        padding: 4px 8px !important;
      }
      .fc .fc-button:hover {
        background-color: #16a34a !important;
        border-color: #16a34a !important;
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen flex flex-col p-3 max-w-md mx-auto">

    <!-- ヘッダータイトル -->
    <div class="card bg-base-100 shadow-sm p-3 mb-3 text-center">
      <h1 class="text-base font-bold text-slate-800">🎾 テニスサークル カレンダー確認</h1>
    </div>

    <!-- カレンダー本体を表示するエリア -->
    <div class="flex-1 mb-3">
      <div id="calendar"></div>
    </div>

    <!-- 操作確認エリア -->
    <div id="info-area" class="card bg-base-100 shadow-sm p-4 text-center text-gray-500 text-xs border border-base-300">
      日付をクリックするとイベント名が表示されます
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        
        var calendar = new FullCalendar.Calendar(calendarEl, {
          locale: 'ja',                  // 日本語化
          initialView: 'dayGridMonth',   // 月表示
          headerToolbar: {
            left: 'prev',
            center: 'title',
            right: 'next'
          },
          height: 'auto',                // 高さを自動調整してスマホで見やすくする
          events: [
            // サンプル用のフェイクデータ
            { title: '土曜練習会', start: '2026-09-05' },
            { title: '土曜練習会', start: '2026-09-12' },
            { title: '大会前練習', start: '2026-09-20' },
            { title: '月末練習', start: '2026-09-26' }
          ],
          dateClick: function(info) {
            // 日付をタップしたときの挙動
            document.getElementById('info-area').innerHTML = `
              <span class="font-bold text-success">${info.dateStr}</span> が選択されました
            `;
          },
          eventClick: function(info) {
            // イベントをタップしたときの挙動
            alert(`イベント: ${info.event.title}\n日付: ${info.event.startStr}`);
          }
        });

        calendar.render();
      });
    </script>
  </body>
</html>
