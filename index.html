<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テニスサークル 予定＆出欠</title>
    <!-- Tailwind CSS & daisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/full.min.css" rel="stylesheet" type="text/css" />
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body class="bg-base-200 min-h-screen flex flex-col p-3 max-w-md mx-auto">

    <!-- 全画面ローディング（データとLINE情報が揃うまでこれを出し続ける） -->
    <div id="loading-screen" class="fixed inset-0 bg-base-200 z-50 flex flex-col items-center justify-center p-4">
      <span class="loading loading-spinner loading-lg text-success"></span>
      <p id="loading-text" class="text-sm text-slate-600 mt-3 font-bold">読み込んでいます...</p>
    </div>

    <!-- メインコンテンツ（最初は非表示） -->
    <div id="main-content" class="hidden flex-1 flex flex-col">
      <!-- ヘッダー（月切り替え） -->
      <div class="card bg-base-100 shadow-sm p-3 mb-3 flex flex-row justify-between items-center">
        <button onclick="changeMonth(-1)" class="btn btn-sm btn-outline">◀ 前月</button>
        <h1 id="month-title" class="text-lg font-bold text-slate-800">2026年 9月</h1>
        <button onclick="changeMonth(1)" class="btn btn-sm btn-outline">次月 ▶</button>
      </div>

      <!-- 予定リストエリア -->
      <div id="event-list" class="flex-1 space-y-2 mb-3"></div>

      <!-- 詳細・操作エリア -->
      <div id="event-detail-area">
        <div class="card bg-base-100 shadow-sm p-4 text-center text-gray-400 text-xs border border-base-300">
          予定をタップすると出欠席の操作ができます
        </div>
      </div>
    </div>

    <script>
      const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxricXsnjpfBfNgmbmLLESqnLVn-bvEm3xbuAVls2Y7SDh3S-h9Eaxuc8L8Ygqn8WmcBg/exec';
      const LIFF_ID = '2011647105-JVOWW7Tw';

      let userProfile = null;
      let allEvents = []; 
      let currentDate = new Date(2026, 8, 1); // 初期表示：2026年9月

      document.addEventListener('DOMContentLoaded', function() {
        const loadingText = document.getElementById('loading-text');
        
        // 1. LINEのLIFF初期化＆プロフィール取得
        const liffPromise = liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (!liff.isLoggedIn()) {
              liff.login();
              return new Promise(() => {}); // ログインリダイレクト時はここで止める
            } else {
              loadingText.textContent = 'LINEの情報を取得中...';
              return liff.getProfile();
            }
          })
          .then(profile => {
            userProfile = profile;
          })
          .catch(err => {
            console.error('LIFF Error:', err);
            // LINE外ブラウザなどでエラーになっても進めるようにする場合のフォールバック
            userProfile = { userId: 'guest', displayName: 'ゲスト' };
          });

        // 2. GASからの予定データ取得
        loadingText.textContent = '予定を読み込んでいます...';
        const fetchPromise = fetch(GAS_API_URL, { cache: 'no-store' })
          .then(response => response.json())
          .then(data => {
            allEvents = data.map(item => ({
              date: item.start || item.date,
              title: item.title || '練習'
            }));
          })
          .catch(error => {
            console.error('Fetch Error:', error);
            throw new Error('予定の取得に失敗しました。');
          });

        // 【重要】LINE情報とGASデータの「両方」の完了を完璧に待つ
        Promise.all([liffPromise, fetchPromise])
          .then(() => {
            // 両方揃ったらローディングを消してメイン画面を表示
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderCalendar();
          })
          .catch(error => {
            document.getElementById('loading-screen').innerHTML = `
              <div class="text-error font-bold text-center p-4">
                エラーが発生しました<br>
                <span class="text-xs text-slate-500 font-normal">${error.message}</span>
              </div>
            `;
          });
      });

      // 月を切り替えるボタンの処理
      function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
      }

      // 画面描画関数
      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); 
        
        document.getElementById('month-title').textContent = `${year}年 ${month + 1}月`;

        const listContainer = document.getElementById('event-list');
        listContainer.innerHTML = '';

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

        let hasEventInMonth = false;

        for (let day = 1; day <= daysInMonth; day++) {
          const dateObj = new Date(year, month, day);
          const yearStr = year;
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(day).padStart(2, '0');
          const dateString = `${yearStr}-${monthStr}-${dayStr}`;
          const dayOfWeek = dayNames[dateObj.getDay()];

          const event = allEvents.find(ev => ev.date === dateString);

          if (event) {
            hasEventInMonth = true;
            const isSun = (dateObj.getDay() === 0);
            const isSat = (dateObj.getDay() === 6);
            const colorClass = isSun ? 'text-red-500' : (isSat ? 'text-blue-500' : 'text-slate-700');

            const card = document.createElement('div');
            card.className = "card bg-base-100 shadow-sm p-3 border-l-4 border-success flex flex-row justify-between items-center cursor-pointer hover:bg-base-200 transition-colors";
            card.onclick = () => showDetail(dateString, event.title);
            card.innerHTML = `
              <div>
                <div class="font-bold text-base ${colorClass}">${month + 1}月 ${day}日 (${dayOfWeek})</div>
                <div class="text-sm text-slate-600 mt-0.5">🎾 ${event.title}</div>
              </div>
              <button class="btn btn-success btn-xs text-white font-bold">出欠席</button>
            `;
            listContainer.appendChild(card);
          }
        }

        if (!hasEventInMonth) {
          listContainer.innerHTML = `
            <div class="card bg-base-100 p-6 text-center text-gray-400 text-sm">
              今月の予定はありません
            </div>
          `;
        }
      }

      // 詳細・操作エリアの表示
      function showDetail(dateStr, title) {
        const parts = dateStr.split('-');
        const formattedDate = `${Number(parts[0])}年 ${Number(parts[1])}月 ${Number(parts[2])}日`;
        const detailArea = document.getElementById('event-detail-area');
        
        detailArea.innerHTML = `
          <div class="card bg-base-100 shadow-md p-4 border border-success">
            <div class="font-bold text-sm text-slate-800 mb-1">選択中: ${formattedDate}</div>
            <div class="text-base text-slate-700 mb-3">🎾 ${title}</div>
            <div class="flex gap-2">
              <button onclick="submitAttendance('${dateStr}', '${title}', '出席')" class="btn btn-success btn-sm flex-1 text-white font-bold">出席する</button>
              <button onclick="submitAttendance('${dateStr}', '${title}', '欠席')" class="btn btn-outline btn-error btn-sm flex-1 font-bold">欠席する</button>
            </div>
          </div>
        `;
      }

      // 出欠席データをGASへ送信
      function submitAttendance(dateStr, title, status) {
        if (!userProfile) {
          alert('LINEのユーザー情報が取得できていません。');
          return;
        }

        if (!confirm(`${userProfile.displayName} さん\n${dateStr} (${title})\n\n「${status}」として登録しますか？`)) {
          return;
        }

        const attendanceData = {
          date: dateStr,
          userId: userProfile.userId,
          displayName: userProfile.displayName,
          status: status
        };

        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(attendanceData)
        })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert(`「${status}」で登録しました！`);
          } else {
            alert('登録に失敗しました: ' + (result.message || '不明なエラー'));
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('通信エラーが発生しました。');
        });
      }
    </script>
  </body>
</html>
