<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習日程</title>

  <!-- 外部ライブラリ：FullCalendar（カレンダー）、Supabase（データベース）、LIFF（LINE ログイン） -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 丸ゴシック（M PLUS Rounded 1c）。使う文字だけ自動で読み込まれる -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- 自前の CSS（FullCalendar のスタイルを上書きするので後に読み込む） -->
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/calendar.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/locations.css">

  <script type="module" src="./js/main.js"></script>
</head>

<body>

  <!-- ===== メニュー（☰ を押すと、そのボタンの真下に開く） ===== -->
  <nav id="menu" class="menu">
    <button class="menu-item is-active" data-view="view-calendar">練習日程</button>
    <!-- 管理者用（admin-only は今は全員に表示されている。権限の仕組みを作るときの目印） -->
    <button class="menu-item admin-only" data-view="view-schedule-edit">予定の追加・編集</button>
    <button class="menu-item admin-only" data-view="view-locations">施設管理</button>
  </nav>

  <!-- ===== 画面（メニューで切り替える） ===== -->
  <main class="views">
    <!-- 練習日程：予定をタップすると出欠モーダル -->
    <section id="view-calendar" class="view-panel is-active">
      <div class="calendar-slot">
        <!-- カレンダー本体。「予定の追加・編集」画面に切り替えると、そちらの calendar-slot へ移動する -->
        <div id="calendar"></div>
      </div>
    </section>

    <!-- 予定の追加・編集：日付をタップで新規登録、予定をタップで編集。地の色を変えて見分ける -->
    <section id="view-schedule-edit" class="view-panel">
      <div class="calendar-slot"></div>
      <!-- リスト表示には日付のセルがない（「＋」が出ない）ので、代わりにこのボタンで追加する。
           リスト表示のときだけ表示する（css/calendar.css） -->
      <button id="reservation-add-button" class="fab">＋ 予定を追加</button>
    </section>

    <!-- 施設管理：カレンダーと同じ地の色とツールバーの形にして、画面がつながって見えるようにする -->
    <section id="view-locations" class="view-panel">
      <div class="page">
        <div class="page-toolbar">
          <button id="location-add-button" class="toolbar-button">＋ 追加</button>
          <h2 class="page-title">施設管理</h2>
          <!-- この画面にはカレンダーのツールバーがないので、ここに ☰ を置く -->
          <button type="button" class="menu-button js-menu-button" aria-label="メニュー"></button>
        </div>
        <!-- 施設のカードは js/screens/locationAdmin.js で作る。タップで編集 -->
        <ul id="location-list" class="location-list"></ul>
      </div>
    </section>
  </main>

  <!-- ===== 出欠モーダル（js/screens/attendanceModal.js） ===== -->
  <div id="attendance-modal" class="modal-overlay">
    <div class="modal">
      <!-- 予定ステータス（開催未定／開催決定／キャンセル）。文言と色は js/screens/attendanceModal.js と css/modals.css -->
      <p id="attendance-status" class="status-banner"></p>

      <dl class="detail-list">
        <div class="detail-row"><dt>場所</dt><dd id="attendance-location"></dd></div>
        <div class="detail-row"><dt>コート</dt><dd id="attendance-court"></dd></div>
        <div class="detail-row"><dt>時間</dt><dd id="attendance-time"></dd></div>
        <div id="attendance-note-row" class="detail-row"><dt>備考</dt><dd id="attendance-note" class="detail-note"></dd></div>
      </dl>

      <section>
        <h3 class="section-label">現在の人数</h3>
        <!-- タップで展開し、〇△×ごとに回答した人（LINE のアイコンと名前）を表示する -->
        <details id="attendance-members" class="members">
          <summary class="members-summary">
            <span id="attendance-counts" class="counts"></span>
            <span class="members-toggle">メンバー</span>
          </summary>
          <div id="attendance-member-list" class="member-groups"></div>
        </details>
      </section>

      <section id="attendance-select">
        <h3 class="section-label">あなたの出欠を選択</h3>
        <!-- 〇△× のアイコンは js/icons.js の共通 SVG を JS で入れる -->
        <div class="attendance-buttons">
          <button class="attendance-button" data-status="ok" aria-label="参加"></button>
          <button class="attendance-button" data-status="pending" aria-label="未定"></button>
          <button class="attendance-button" data-status="ng" aria-label="不参加"></button>
        </div>
      </section>

      <div class="modal-footer">
        <button class="btn btn-subtle" data-close-modal>閉じる</button>
      </div>
    </div>
  </div>

  <!-- ===== 予定の登録・編集モーダル（js/screens/reservationModal.js） ===== -->
  <div id="reservation-modal" class="modal-overlay">
    <div class="modal">
      <h3 id="reservation-modal-title" class="modal-title">予定の登録</h3>

      <div class="form">
        <div class="form-group">
          <label class="form-label" for="reservation-date">日付</label>
          <input type="date" id="reservation-date" class="form-control">
        </div>

        <div class="form-group">
          <span class="form-label">ステータス</span>
          <!-- 選択肢は js/reservationStatus.js から作る -->
          <div id="reservation-status" class="segmented" role="radiogroup" aria-label="ステータス"></div>
        </div>

        <div class="form-group">
          <span class="form-label">場所</span>
          <!-- タップで施設のドラム（#drum-picker-modal）が開く -->
          <button type="button" id="reservation-location" class="form-control form-trigger">
            <span class="form-trigger-text"></span>
            <span class="form-trigger-arrow">▼</span>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="reservation-court">コート</label>
          <input type="text" id="reservation-court" class="form-control" placeholder="例: 4番コート">
        </div>

        <div class="form-group">
          <span class="form-label">時間</span>
          <!-- タップで「開始 ～ 終了」のドラム（#drum-picker-modal）が開く。分は選ばず :00 -->
          <button type="button" id="reservation-time" class="form-control form-trigger">
            <span id="reservation-time-text"></span>
            <span class="form-trigger-arrow">▼</span>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="reservation-note">備考</label>
          <textarea id="reservation-note" class="form-control" rows="3"></textarea>
        </div>
      </div>

      <div class="modal-footer is-split">
        <button id="reservation-delete-button" class="btn btn-danger">削除</button>
        <div class="btn-group">
          <button class="btn" data-close-modal>キャンセル</button>
          <button id="reservation-save-button" class="btn btn-primary">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ドラムを回して値を選ぶダイアログ（js/ui/drumPicker.js）=====
       予定の時間・施設のキャンセル期限・最少人数で共通。ほかのモーダルの上に重ねて開く。
       ドラムの列は開くたびに JS で作る -->
  <div id="drum-picker-modal" class="modal-overlay modal-overlay--front">
    <div class="modal">
      <h3 id="drum-picker-title" class="modal-title text-center"></h3>
      <div id="drum-picker-row" class="drum-row"></div>
      <p id="drum-picker-error" class="field-error text-center" hidden></p>
      <div class="modal-footer is-full">
        <button type="button" class="btn" data-close-modal>キャンセル</button>
        <button type="button" id="drum-picker-confirm" class="btn btn-primary">決定</button>
      </div>
    </div>
  </div>

  <!-- ===== 施設の登録・編集モーダル（js/screens/locationAdmin.js） ===== -->
  <div id="location-modal" class="modal-overlay">
    <div class="modal">
      <h3 id="location-modal-title" class="modal-title">施設の登録</h3>

      <div class="form">
        <div class="form-group">
          <label class="form-label" for="location-name">正式名称（リスト表示・出欠画面で使います）</label>
          <input type="text" id="location-name" class="form-control" placeholder="例: 円山公園">
        </div>

        <div class="form-group">
          <label class="form-label" for="location-short-name">省略名（カレンダーの予定カードで使います）</label>
          <!-- セルの幅は全角4文字くらいしかないので、短めに -->
          <input type="text" id="location-short-name" class="form-control" maxlength="8" placeholder="例: 円山">
        </div>

        <!-- キャンセル期限・最少人数：タップでドラム（#drum-picker-modal）が開く -->
        <div class="form-group">
          <span class="form-label">キャンセル期限</span>
          <button type="button" id="location-deadline" class="form-control form-trigger">
            <span class="form-trigger-text"></span>
            <span class="form-trigger-arrow">▼</span>
          </button>
        </div>

        <div class="form-group">
          <span class="form-label">最少人数</span>
          <button type="button" id="location-min" class="form-control form-trigger">
            <span class="form-trigger-text"></span>
            <span class="form-trigger-arrow">▼</span>
          </button>
        </div>
      </div>

      <div class="modal-footer is-split">
        <button id="location-delete-button" class="btn btn-danger">削除</button>
        <div class="btn-group">
          <button class="btn btn-ghost" data-close-modal>キャンセル</button>
          <button id="location-save-button" class="btn btn-primary">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 読み込み中の表示（js/ui/feedback.js） ===== -->
  <!-- エラー・削除の確認などのダイアログ（js/ui/dialog.js）。すべてのモーダルより手前に出る -->
  <div id="dialog-modal" class="modal-overlay modal-overlay--dialog" role="alertdialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <div class="modal dialog">
      <div class="dialog-header">
        <span class="dialog-icon" aria-hidden="true"></span>
        <h3 id="dialog-title" class="modal-title"></h3>
      </div>
      <p id="dialog-message" class="dialog-message"></p>
      <!-- 管理者に連絡するときに伝えてもらうコードと、起きた日時 -->
      <div id="dialog-code" class="dialog-code" hidden>
        <span class="dialog-code-label">エラーコード</span>
        <span class="dialog-code-value"></span>
        <span class="dialog-code-time"></span>
      </div>
      <div id="dialog-footer" class="modal-footer is-full"></div>
    </div>
  </div>

  <!-- アプリを起動できないときの画面全体のエラー（js/ui/feedback.js の showFatalError） -->
  <section id="fatal-screen" class="fatal-screen" hidden>
    <div class="fatal-box">
      <span class="dialog-icon" aria-hidden="true"></span>
      <h2 id="fatal-title" class="fatal-title"></h2>
      <p id="fatal-message" class="dialog-message"></p>
      <p id="fatal-code" class="fatal-code"></p>
      <button type="button" class="btn btn-primary" onclick="location.reload()">再読み込み</button>
    </div>
  </section>

  <div id="loading" class="loading-overlay" hidden>
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loading-text">読み込み中...</div>
    </div>
  </div>

</body>

</html>
